name: Robotics CI & Kinematics Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  python-tests:
    name: Unit Tests & Kinematics Verification
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ "3.10", "3.11", "3.12" ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Test Suite
        run: |
          pytest -v 04-python-robotics/tests/

  markdown-link-check:
    name: Markdown Structure & Link Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Markdown Files & URDF XML
        run: |
          python -c "
          import os, glob, xml.etree.ElementTree as ET

          # Check URDF files
          urdf_files = glob.glob('**/*.urdf', recursive=True)
          assert len(urdf_files) >= 1, 'No URDF files found'
          for u in urdf_files:
              ET.parse(u)
              print(f'Valid XML: {u}')

          # Check Markdown count
          md_files = glob.glob('**/*.md', recursive=True)
          assert len(md_files) >= 40, f'Expected at least 40 markdown files, found {len(md_files)}'
          print(f'Validated {len(md_files)} documentation markdown files.')
          "
