name: Robotics CI & Kinematics Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  python-tests:
    name: Unit Tests & Kinematics Verification
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ "3.10", "3.11", "3.12" ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Test Suite
        run: |
          pytest -v 04-python-robotics/tests/

  markdown-link-check:
    name: Markdown Structure, Link Integrity & Package Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Markdown Links
        run: |
          python scripts/check_links.py

      - name: Validate URDF Files and Identity
        run: |
          python -c "
          import filecmp, glob, xml.etree.ElementTree as ET
          # Verify both URDF copies exist and are strictly identical
          u1 = '05-ros2-practical/urdf/eduarm_6dof.urdf'
          u2 = 'eduarm_description/urdf/eduarm_6dof.urdf'
          assert filecmp.cmp(u1, u2, shallow=False), f'URDF files {u1} and {u2} do not match!'
          print('Verified URDF copies are identical.')

          # Validate XML parsing for all URDF files
          urdf_files = glob.glob('**/*.urdf', recursive=True)
          assert len(urdf_files) >= 2, 'Expected at least 2 URDF files'
          for u in urdf_files:
              ET.parse(u)
              print(f'Valid XML: {u}')
          "

      - name: Validate ROS 2 Package Metadata
        run: |
          python -c "
          import xml.etree.ElementTree as ET
          pkg_tree = ET.parse('eduarm_description/package.xml')
          root = pkg_tree.getroot()
          assert root.tag == 'package', 'Root tag must be package'
          assert root.attrib.get('format') == '3', 'Package format must be 3'
          assert root.find('name').text == 'eduarm_description', 'Package name mismatch'
          exec_deps = {d.text for d in root.findall('exec_depend')}
          expected = {'robot_state_publisher', 'joint_state_publisher_gui', 'rviz2', 'urdf', 'launch', 'launch_ros'}
          assert expected.issubset(exec_deps), f'Missing dependencies: {expected - exec_deps}'
          print('Package metadata validated successfully.')
          "

  docs-build:
    name: MkDocs Documentation Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MkDocs Material
        run: pip install mkdocs-material

      - name: Build Documentation (strict)
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: python -m mkdocs build --strict -f .mkdocs/mkdocs.yml -d /tmp/robotics-notes-site

