site_name: "Robotics & AI Student Notes: Kinematics, TF2 & Robotics Mathematics"
site_description: "Engineering-grade educational textbook and interactive laboratory repository for robotics, kinematics, TF2, and Denavit-Hartenberg modeling."
site_author: "JosiahSK"
site_url: "https://josiahsk.github.io/robotics-kinematics-tf2/"
repo_url: "https://github.com/JosiahSK/robotics-kinematics-tf2"
repo_name: "JosiahSK/robotics-kinematics-tf2"

docs_dir: "."

exclude_docs: |
  .git/**
  venv/**
  .pytest_cache/**
  scripts/**
  eduarm_description/**
  assets/blender/**

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.details
  - admonition
  - tables
  - attr_list
  - toc:
      permalink: true

extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.js

nav:
  - Home: README.md
  - "00: Getting Started":
      - Overview: 00-getting-started/README.md
      - Robotics Fundamentals: 00-getting-started/robotics-fundamentals.md
      - Mathematical Prerequisites: 00-getting-started/mathematical-prerequisites.md
  - "02: Mathematics for Robotics":
      - Overview: 02-module-54-mathematics/README.md
      - 01 Vectors: 02-module-54-mathematics/01-vectors.md
      - 02 Matrices: 02-module-54-mathematics/02-matrices.md
      - 03 Dot & Cross Products: 02-module-54-mathematics/03-dot-and-cross-products.md
      - 04 Homogeneous Transforms: 02-module-54-mathematics/04-homogeneous-transformations.md
      - 05 Calculus for Robotics: 02-module-54-mathematics/05-derivatives-and-calculus.md
      - 06 Jacobians & Gradients: 02-module-54-mathematics/06-jacobians.md
      - 07 Probability & Bayes: 02-module-54-mathematics/07-probability.md
      - 08 Gaussian Distributions: 02-module-54-mathematics/08-gaussian-distributions.md
      - 09 Covariance & Sensor Fusion: 02-module-54-mathematics/09-covariance-matrices.md
      - Module 54 Exercises: 02-module-54-mathematics/exercises.md
