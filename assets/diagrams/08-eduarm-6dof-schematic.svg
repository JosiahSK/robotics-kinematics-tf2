<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <defs>
    <marker id="arr-axis" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2980b9" />
    </marker>
    <marker id="dim-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#7f8c8d" />
    </marker>
    <filter id="drop" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Header -->
  <text x="480" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">
    EduArm-6DOF: Canonical Kinematic Schematic &amp; Joint Axes
  </text>
  <text x="480" y="60" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#7f8c8d">
    6-DOF Anthropomorphic Manipulator with Spherical Wrist (Axes 4, 5, 6 Intersect at Wrist Center)
  </text>

  <!-- Ground Pedestal -->
  <rect x="100" y="470" width="160" height="20" rx="3" fill="#2c3e50" />
  <text x="180" y="505" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#7f8c8d">Base Pedestal (Frame 0)</text>

  <!-- Robot Arm Kinematic Links -->
  <!-- Link 1: Base waist column (Height d1 = 0.400m) -->
  <rect x="160" y="320" width="40" height="150" fill="#e67e22" rx="4" />
  <circle cx="180" cy="470" r="8" fill="#2c3e50" />
  <text x="130" y="400" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#e67e22">Link 1</text>

  <!-- Joint 1: Base Waist -->
  <circle cx="180" cy="320" r="14" fill="#34495e" />
  <text x="180" y="325" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#ffffff">J1</text>
  <line x1="180" y1="360" x2="180" y2="280" stroke="#2980b9" stroke-width="3" marker-end="url(#arr-axis)" />
  <text x="195" y="290" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#2980b9">z0 (J1 axis)</text>

  <!-- Link 2: Upper arm (Length a2 = 0.500m) -->
  <!-- Joint 2: Shoulder Pitch -->
  <circle cx="180" cy="320" r="12" fill="#2980b9" />
  <line x1="180" y1="320" x2="440" y2="200" stroke="#7f8c8d" stroke-width="18" stroke-linecap="round" />
  <line x1="180" y1="320" x2="440" y2="200" stroke="#bdc3c7" stroke-width="12" stroke-linecap="round" />
  <text x="300" y="240" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2c3e50">Link 2 (Upper Arm, a2 = 0.500 m)</text>

  <!-- Shoulder axis z1 -->
  <circle cx="180" cy="320" r="6" fill="#e74c3c" />
  <text x="140" y="315" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#e74c3c">z1 (J2 pitch)</text>

  <!-- Joint 3: Elbow Pitch -->
  <circle cx="440" cy="200" r="14" fill="#34495e" />
  <text x="440" y="205" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#ffffff">J3</text>
  <circle cx="440" cy="200" r="6" fill="#e74c3c" />
  <text x="400" y="185" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#e74c3c">z2 (J3 pitch)</text>

  <!-- Link 4: Forearm (Length d4 = 0.450m) -->
  <line x1="440" y1="200" x2="680" y2="200" stroke="#e67e22" stroke-width="14" stroke-linecap="round" />
  <text x="560" y="185" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#d35400">Link 4 (Forearm, d4 = 0.450 m)</text>
  <line x1="450" y1="200" x2="520" y2="200" stroke="#2980b9" stroke-width="3" marker-end="url(#arr-axis)" />
  <text x="490" y="225" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#2980b9">z3 (J4 roll)</text>

  <!-- Spherical Wrist Intersection (Joints 4, 5, 6) -->
  <circle cx="680" cy="200" r="22" fill="none" stroke="#e74c3c" stroke-width="2" stroke-dasharray="4,3" />
  <!-- Wrist Center Marker -->
  <circle cx="680" cy="200" r="10" fill="#c0392b" />
  <text x="680" y="170" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#c0392b">
    Wrist Center p_wc
  </text>
  <text x="680" y="152" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#7f8c8d">
    Axes J4, J5, J6 Intersect Here!
  </text>

  <!-- Wrist Pitch Axis z4 -->
  <line x1="680" y1="230" x2="680" y2="170" stroke="#27ae60" stroke-width="3" />
  <text x="695" y="235" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#27ae60">z4 (J5 pitch)</text>

  <!-- Tool Flange Link 6 (Length d6 = 0.100m) -->
  <line x1="680" y1="200" x2="780" y2="200" stroke="#3498db" stroke-width="10" stroke-linecap="round" />
  <circle cx="780" cy="200" r="8" fill="#2980b9" />
  <text x="730" y="225" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#2980b9">Link 6 (d6 = 0.100 m)</text>

  <!-- Tool Center Point (TCP) -->
  <circle cx="840" cy="200" r="6" fill="#f39c12" />
  <line x1="780" y1="200" x2="840" y2="200" stroke="#f39c12" stroke-width="3" stroke-dasharray="3,3" />
  <polygon points="840,195 855,200 840,205" fill="#f39c12" />
  <text x="850" y="185" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#d35400">
    TCP (End-Effector)
  </text>

  <!-- Dimension Markers -->
  <!-- d1 dimension -->
  <line x1="80" y1="470" x2="80" y2="320" stroke="#7f8c8d" stroke-width="1.5" />
  <line x1="75" y1="470" x2="85" y2="470" stroke="#7f8c8d" stroke-width="1.5" />
  <line x1="75" y1="320" x2="85" y2="320" stroke="#7f8c8d" stroke-width="1.5" />
  <text x="70" y="400" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#7f8c8d">d1 = 0.400 m</text>

  <!-- DH Table Inset Box -->
  <g transform="translate(480, 360)">
    <rect x="0" y="0" width="440" height="150" rx="8" fill="#f8f9fa" stroke="#bdc3c7" stroke-width="1.5" filter="url(#drop)" />
    <text x="220" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2c3e50">
      EduArm-6DOF Standard DH Parameters
    </text>
    <line x1="15" y1="32" x2="425" y2="32" stroke="#e2e8f0" stroke-width="1" />
    <text x="30" y="52" font-family="monospace" font-size="11" fill="#2c3e50">Link 1: θ1 (var), d1 = 0.400 m, a1 = 0.000, α1 = +90°</text>
    <text x="30" y="72" font-family="monospace" font-size="11" fill="#2c3e50">Link 2: θ2 (var), d2 = 0.000 m, a2 = 0.500, α2 =   0°</text>
    <text x="30" y="92" font-family="monospace" font-size="11" fill="#2c3e50">Link 3: θ3 (var), d3 = 0.000 m, a3 = 0.000, α3 = +90°</text>
    <text x="30" y="112" font-family="monospace" font-size="11" fill="#2c3e50">Link 4: θ4 (var), d4 = 0.450 m, a4 = 0.000, α4 = -90°</text>
    <text x="30" y="132" font-family="monospace" font-size="11" fill="#2c3e50">Link 5: θ5 (var), d5 = 0.000 m, a5 = 0.000, α5 = +90°</text>
    <text x="30" y="148" font-family="monospace" font-size="11" fill="#2c3e50">Link 6: θ6 (var), d6 = 0.100 m, a6 = 0.000, α6 =   0°</text>
  </g>
</svg>
