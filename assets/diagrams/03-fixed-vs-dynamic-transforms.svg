<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7f8c8d" />
    </marker>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Header -->
  <text x="450" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">
    Static vs Dynamic Transforms in ROS 2 TF2
  </text>
  <text x="450" y="62" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#7f8c8d">
    Topic: /tf_static (Latched, Zero Overhead) vs /tf (Continuous Stream with Timestamps)
  </text>

  <!-- Left Card: Static Transforms -->
  <g transform="translate(60, 90)">
    <rect x="0" y="0" width="360" height="320" rx="12" fill="#f8fcf9" stroke="#27ae60" stroke-width="2" filter="url(#card-shadow)" />
    
    <!-- Card Header -->
    <rect x="0" y="0" width="360" height="50" rx="12" fill="#27ae60" />
    <rect x="0" y="35" width="360" height="15" fill="#27ae60" />
    <text x="180" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">
      Static Transforms (/tf_static)
    </text>

    <!-- Characteristics -->
    <g transform="translate(25, 75)" font-family="system-ui, sans-serif" font-size="13" fill="#2c3e50">
      <text x="0" y="0" font-weight="bold" fill="#145a32">Publication Rate:</text>
      <text x="0" y="20">Published ONCE upon node initialization</text>

      <text x="0" y="55" font-weight="bold" fill="#145a32">ROS 2 QoS Profile:</text>
      <text x="0" y="75">Transient Local (Latched message buffer)</text>

      <text x="0" y="110" font-weight="bold" fill="#145a32">Network &amp; CPU Cost:</text>
      <text x="0" y="130">Zero ongoing bandwidth after startup</text>

      <text x="0" y="165" font-weight="bold" fill="#145a32">Typical Robot Components:</text>
      <text x="0" y="185">• LiDAR chassis mount (base_link → laser_frame)</text>
      <text x="0" y="205">• Camera extrinsics (base_link → camera_link)</text>
      <text x="0" y="225">• Fixed gripper TCP offset (flange → tcp)</text>
    </g>
  </g>

  <!-- Right Card: Dynamic Transforms -->
  <g transform="translate(480, 90)">
    <rect x="0" y="0" width="360" height="320" rx="12" fill="#fbfcfe" stroke="#2980b9" stroke-width="2" filter="url(#card-shadow)" />
    
    <!-- Card Header -->
    <rect x="0" y="0" width="360" height="50" rx="12" fill="#2980b9" />
    <rect x="0" y="35" width="360" height="15" fill="#2980b9" />
    <text x="180" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">
      Dynamic Transforms (/tf)
    </text>

    <!-- Characteristics -->
    <g transform="translate(25, 75)" font-family="system-ui, sans-serif" font-size="13" fill="#2c3e50">
      <text x="0" y="0" font-weight="bold" fill="#1b4f72">Publication Rate:</text>
      <text x="0" y="20">Continuous streaming (30 Hz, 50 Hz, 100 Hz)</text>

      <text x="0" y="55" font-weight="bold" fill="#1b4f72">ROS 2 QoS Profile:</text>
      <text x="0" y="75">Volatile (Latest values with precise timestamps)</text>

      <text x="0" y="110" font-weight="bold" fill="#1b4f72">Network &amp; CPU Cost:</text>
      <text x="0" y="130">Active serialization &amp; time buffer maintenance</text>

      <text x="0" y="165" font-weight="bold" fill="#1b4f72">Typical Robot Components:</text>
      <text x="0" y="185">• Wheel odometry (odom → base_link)</text>
      <text x="0" y="205">• Moving robot arm joints (link_1 → link_2 → ...)</text>
      <text x="0" y="225">• Pan-tilt gimbal orientation</text>
    </g>
  </g>

  <!-- Footer Tip -->
  <rect x="60" y="425" width="780" height="38" rx="6" fill="#f8f9fa" stroke="#e2e8f0" />
  <text x="450" y="449" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#4a5568">
    <tspan font-weight="bold" fill="#c0392b">Pro Tip:</tspan> Never broadcast rigid sensor mounts on /tf. Broadcasting static transforms on /tf wastes CPU cycles and clutters the buffer.
  </text>
</svg>
