<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e74c3c" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#27ae60" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2980b9" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7f8c8d" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">
    ROS 2 Coordinate Frame Conventions (REP 103) &amp; TF Tree
  </text>
  <text x="450" y="62" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#7f8c8d">
    Right-Hand Rule: X = Forward (Red), Y = Left (Green), Z = Up (Blue)
  </text>

  <!-- Left Side: 3D Triad Diagram -->
  <g transform="translate(180, 260)">
    <!-- Chassis footprint -->
    <rect x="-90" y="-70" width="180" height="140" rx="20" fill="#f8f9fa" stroke="#bdc3c7" stroke-width="2" stroke-dasharray="6,4" />
    <text x="0" y="95" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#7f8c8d" font-weight="bold">Robot Base Footprint</text>

    <!-- Wheels -->
    <rect x="-105" y="-60" width="20" height="40" rx="4" fill="#34495e" />
    <rect x="85" y="-60" width="20" height="40" rx="4" fill="#34495e" />
    <rect x="-105" y="20" width="20" height="40" rx="4" fill="#34495e" />
    <rect x="85" y="20" width="20" height="40" rx="4" fill="#34495e" />

    <!-- Origin circle -->
    <circle cx="0" cy="0" r="8" fill="#2c3e50" />
    <text x="-15" y="-12" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">base_link</text>

    <!-- Axes -->
    <!-- X: Forward (Upwards in 2D top-down perspective, drawn toward top-right) -->
    <line x1="0" y1="0" x2="0" y2="-120" stroke="#e74c3c" stroke-width="4" marker-end="url(#arrow-red)" />
    <text x="12" y="-115" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#e74c3c">+X (Forward / Roll)</text>

    <!-- Y: Left -->
    <line x1="0" y1="0" x2="-120" y2="0" stroke="#27ae60" stroke-width="4" marker-end="url(#arrow-green)" />
    <text x="-130" y="-12" text-anchor="end" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#27ae60">+Y (Left / Pitch)</text>

    <!-- Z: Up (out of page) -->
    <circle cx="0" cy="0" r="14" fill="none" stroke="#2980b9" stroke-width="3" />
    <circle cx="0" cy="0" r="4" fill="#2980b9" />
    <text x="22" y="22" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2980b9">+Z (Up / Yaw)</text>
  </g>

  <!-- Right Side: TF Tree Hierarchy -->
  <g transform="translate(600, 100)">
    <text x="100" y="0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Standard TF Tree (REP 105)</text>

    <!-- Node: map -->
    <g transform="translate(0, 30)">
      <rect x="0" y="0" width="200" height="42" rx="8" fill="#e8f4f8" stroke="#2980b9" stroke-width="2" filter="url(#shadow)" />
      <text x="100" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1b4f72">map</text>
    </g>

    <line x1="100" y1="72" x2="100" y2="108" stroke="#7f8c8d" stroke-width="2.5" marker-end="url(#arrow-gray)" />
    <text x="110" y="94" font-family="system-ui, sans-serif" font-size="10" fill="#7f8c8d">SLAM / Localization</text>

    <!-- Node: odom -->
    <g transform="translate(0, 110)">
      <rect x="0" y="0" width="200" height="42" rx="8" fill="#e8f8f5" stroke="#27ae60" stroke-width="2" filter="url(#shadow)" />
      <text x="100" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#145a32">odom</text>
    </g>

    <line x1="100" y1="152" x2="100" y2="188" stroke="#7f8c8d" stroke-width="2.5" marker-end="url(#arrow-gray)" />
    <text x="110" y="174" font-family="system-ui, sans-serif" font-size="10" fill="#7f8c8d">Wheel Odometry / IMU</text>

    <!-- Node: base_link -->
    <g transform="translate(0, 190)">
      <rect x="0" y="0" width="200" height="42" rx="8" fill="#fbeee6" stroke="#e67e22" stroke-width="2" filter="url(#shadow)" />
      <text x="100" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#78281f">base_link</text>
    </g>

    <!-- Branching to sensors -->
    <line x1="40" y1="232" x2="-40" y2="280" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrow-gray)" />
    <line x1="100" y1="232" x2="100" y2="280" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrow-gray)" />
    <line x1="160" y1="232" x2="240" y2="280" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrow-gray)" />

    <!-- Sensor 1: laser_link -->
    <g transform="translate(-110, 282)">
      <rect x="0" y="0" width="130" height="36" rx="6" fill="#f2f3f4" stroke="#7f8c8d" stroke-width="1.5" />
      <text x="65" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#2c3e50">laser_link</text>
    </g>

    <!-- Sensor 2: arm_base_link -->
    <g transform="translate(35, 282)">
      <rect x="0" y="0" width="130" height="36" rx="6" fill="#f2f3f4" stroke="#7f8c8d" stroke-width="1.5" />
      <text x="65" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#2c3e50">arm_base_link</text>
    </g>

    <!-- Sensor 3: camera_link -->
    <g transform="translate(180, 282)">
      <rect x="0" y="0" width="130" height="36" rx="6" fill="#f2f3f4" stroke="#7f8c8d" stroke-width="1.5" />
      <text x="65" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#2c3e50">camera_link</text>
    </g>
  </g>

  <!-- Bottom Legend Bar -->
  <rect x="50" y="445" width="800" height="36" rx="6" fill="#f8f9fa" stroke="#e2e8f0" />
  <text x="450" y="468" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#4a5568">
    Rule: A valid TF tree is a single directed tree where every node has exactly one parent (except root).
  </text>
</svg>
