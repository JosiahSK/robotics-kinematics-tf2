<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e74c3c" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#27ae60" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2980b9" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8e44ad" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Header -->
  <text x="450" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">
    Camera Body Frame vs Camera Optical Frame
  </text>
  <text x="450" y="62" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#7f8c8d">
    Bridging the Gap Between Robotics (REP 103) and Computer Vision / OpenCV Standards
  </text>

  <!-- Left Side: Camera Body Frame (camera_link) -->
  <g transform="translate(220, 240)">
    <!-- Camera Body Silhouette -->
    <rect x="-60" y="-45" width="120" height="90" rx="10" fill="#34495e" />
    <!-- Lens -->
    <path d="M 60 -25 L 85 -35 L 85 35 L 60 25 Z" fill="#2c3e50" />
    <circle cx="0" cy="0" r="10" fill="#e67e22" />

    <!-- Axes: REP 103 standard -->
    <!-- X: Forward along optical axis -->
    <line x1="0" y1="0" x2="110" y2="0" stroke="#e74c3c" stroke-width="3.5" marker-end="url(#arr-red)" />
    <text x="120" y="5" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#e74c3c">+X (Forward)</text>

    <!-- Y: Left (drawn up/left in perspective) -->
    <line x1="0" y1="0" x2="-50" y2="-50" stroke="#27ae60" stroke-width="3.5" marker-end="url(#arr-green)" />
    <text x="-58" y="-55" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#27ae60">+Y (Left)</text>

    <!-- Z: Up -->
    <line x1="0" y1="0" x2="0" y2="-90" stroke="#2980b9" stroke-width="3.5" marker-end="url(#arr-blue)" />
    <text x="10" y="-92" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2980b9">+Z (Up)</text>

    <text x="0" y="75" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2c3e50">
      camera_link (Body Frame)
    </text>
    <text x="0" y="93" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#7f8c8d">
      Standard ROS 2 Robotics Frame (REP 103)
    </text>
  </g>

  <!-- Conversion Curved Arrow -->
  <g transform="translate(450, 220)">
    <path d="M -40 -30 Q 0 -60 40 -30" fill="none" stroke="#8e44ad" stroke-width="3" marker-end="url(#arr-purple)" />
    <text x="0" y="-70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#8e44ad">
      Conversion
    </text>
    <text x="0" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">
      rpy = "-1.5708 0 -1.5708"
    </text>
    <text x="0" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#7f8c8d">
      Roll: -90°, Yaw: -90°
    </text>
  </g>

  <!-- Right Side: Camera Optical Frame (camera_optical_frame) -->
  <g transform="translate(680, 240)">
    <!-- Camera Body Silhouette -->
    <rect x="-60" y="-45" width="120" height="90" rx="10" fill="#34495e" />
    <path d="M 60 -25 L 85 -35 L 85 35 L 60 25 Z" fill="#2c3e50" />
    <circle cx="0" cy="0" r="10" fill="#9b59b6" />

    <!-- Axes: Computer Vision / OpenCV standard -->
    <!-- Z: Forward into the scene (Depth) -->
    <line x1="0" y1="0" x2="110" y2="0" stroke="#2980b9" stroke-width="3.5" marker-end="url(#arr-blue)" />
    <text x="120" y="5" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2980b9">+Z (Depth / Into Scene)</text>

    <!-- X: Right across image width -->
    <line x1="0" y1="0" x2="50" y2="50" stroke="#e74c3c" stroke-width="3.5" marker-end="url(#arr-red)" />
    <text x="58" y="55" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#e74c3c">+X (Image Right / u)</text>

    <!-- Y: Down across image height -->
    <line x1="0" y1="0" x2="0" y2="85" stroke="#27ae60" stroke-width="3.5" marker-end="url(#arr-green)" />
    <text x="10" y="95" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#27ae60">+Y (Image Down / v)</text>

    <text x="0" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#2c3e50">
      camera_optical_frame
    </text>
    <text x="0" y="133" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#7f8c8d">
      OpenCV / PointCloud2 PCL Standard
    </text>
  </g>

  <!-- Summary Box -->
  <rect x="50" y="420" width="800" height="42" rx="6" fill="#f8f9fa" stroke="#e2e8f0" />
  <text x="450" y="445" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#2c3e50">
    <tspan font-weight="bold" fill="#8e44ad">Rule:</tspan> PointCloud2 and Image topics MUST publish their header.frame_id as <tspan font-family="monospace">camera_optical_frame</tspan>, connected to <tspan font-family="monospace">camera_link</tspan> by a static transform.
  </text>
</svg>
