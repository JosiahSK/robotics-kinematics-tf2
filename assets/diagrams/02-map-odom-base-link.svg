<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2980b9" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#27ae60" />
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e67e22" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8e44ad" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Header -->
  <text x="450" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">
    The map → odom → base_link Coordinate Hierarchy (REP 105)
  </text>
  <text x="450" y="62" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#7f8c8d">
    Decoupling Smooth Continuous Motion from Discrete Global Drift Corrections
  </text>

  <!-- Frame 1: map Origin -->
  <g transform="translate(140, 200)">
    <circle cx="0" cy="0" r="10" fill="#2980b9" />
    <line x1="0" y1="0" x2="60" y2="0" stroke="#e74c3c" stroke-width="3" marker-end="url(#arr-blue)" />
    <line x1="0" y1="0" x2="0" y2="-60" stroke="#27ae60" stroke-width="3" marker-end="url(#arr-green)" />
    <text x="68" y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#e74c3c">X_map</text>
    <text x="-5" y="-68" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#27ae60">Y_map</text>
    
    <rect x="-80" y="20" width="160" height="65" rx="6" fill="#ebf5fb" stroke="#2980b9" stroke-width="1.5" />
    <text x="0" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1b4f72">map Frame</text>
    <text x="0" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#2874a6">World-fixed, origin at start</text>
    <text x="0" y="72" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#2874a6">Discrete jumps allowed (SLAM)</text>
  </g>

  <!-- Transform 1: map -> odom -->
  <path d="M 220 180 Q 340 100 460 160" fill="none" stroke="#8e44ad" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arr-purple)" />
  <text x="340" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#8e44ad">T_map^odom (Correction)</text>
  <text x="340" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#7d3c98">Computed by AMCL / SLAM</text>
  <text x="340" y="146" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#7d3c98">(Compensates for accumulated drift)</text>

  <!-- Frame 2: odom Frame (Drifting) -->
  <g transform="translate(480, 180)">
    <circle cx="0" cy="0" r="10" fill="#27ae60" />
    <line x1="0" y1="0" x2="55" y2="15" stroke="#e74c3c" stroke-width="3" marker-end="url(#arr-blue)" />
    <line x1="0" y1="0" x2="-15" y2="-55" stroke="#27ae60" stroke-width="3" marker-end="url(#arr-green)" />
    <text x="62" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#e74c3c">X_odom</text>
    <text x="-20" y="-62" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#27ae60">Y_odom</text>

    <rect x="-80" y="25" width="160" height="65" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5" />
    <text x="0" y="45" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#145a32">odom Frame</text>
    <text x="0" y="63" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#196f3d">Locally continuous &amp; smooth</text>
    <text x="0" y="77" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#196f3d">Subject to dead-reckoning drift</text>
  </g>

  <!-- Transform 2: odom -> base_link -->
  <path d="M 560 170 Q 660 130 720 200" fill="none" stroke="#27ae60" stroke-width="3.5" marker-end="url(#arr-green)" />
  <text x="650" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#196f3d">T_odom^base (Odometry)</text>
  <text x="650" y="162" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#196f3d">High frequency (50–100 Hz)</text>
  <text x="650" y="176" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#196f3d">NO sudden jumps</text>

  <!-- Frame 3: base_link (Robot) -->
  <g transform="translate(740, 240)">
    <!-- Robot outline -->
    <rect x="-35" y="-25" width="70" height="50" rx="8" fill="#fbeee6" stroke="#e67e22" stroke-width="2" />
    <circle cx="0" cy="0" r="6" fill="#e67e22" />
    <line x1="0" y1="0" x2="45" y2="-10" stroke="#e74c3c" stroke-width="3" marker-end="url(#arr-orange)" />
    <line x1="0" y1="0" x2="10" y2="-45" stroke="#27ae60" stroke-width="3" marker-end="url(#arr-green)" />
    <text x="50" y="-8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#e74c3c">X_base</text>
    <text x="12" y="-50" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#27ae60">Y_base</text>

    <text x="0" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#78281f">base_link</text>
    <text x="0" y="56" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#78281f">Robot Chassis Frame</text>
  </g>

  <!-- Big Composition Arrow: map -> base_link -->
  <path d="M 170 270 Q 450 420 710 270" fill="none" stroke="#2c3e50" stroke-width="3" marker-end="url(#arr-blue)" />
  <rect x="330" y="340" width="240" height="48" rx="6" fill="#ffffff" stroke="#2c3e50" stroke-width="2" />
  <text x="450" y="362" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2c3e50">
    T_map^base = T_map^odom · T_odom^base
  </text>
  <text x="450" y="378" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#566573">
    Global Robot Pose (Fused Transformation)
  </text>

  <!-- Summary Box at Bottom -->
  <rect x="50" y="445" width="800" height="50" rx="8" fill="#f8f9fa" stroke="#d5dbdb" />
  <text x="450" y="468" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">
    Key Engineering Insight:
  </text>
  <text x="450" y="486" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#4a5568">
    Controllers (Nav2) plan in odom to prevent velocity spikes during SLAM corrections, while path planning operates in map.
  </text>
</svg>
