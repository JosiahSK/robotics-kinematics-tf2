<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <marker id="arr-flow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2c3e50" />
    </marker>
    <marker id="arr-tf" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e67e22" />
    </marker>
    <filter id="box-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Header -->
  <text x="480" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">
    ROS 2 TF2 Computational Graph &amp; Kinematic Data Flow
  </text>
  <text x="480" y="60" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#7f8c8d">
    How URDF Descriptions and Joint Positions Propagate into the Global 3D Coordinate Tree
  </text>

  <!-- Left: Inputs -->
  <!-- Input 1: URDF XML Model -->
  <g transform="translate(60, 110)">
    <rect x="0" y="0" width="220" height="110" rx="8" fill="#f8f9fa" stroke="#7f8c8d" stroke-width="2" filter="url(#box-shadow)" />
    <rect x="0" y="0" width="220" height="30" rx="8" fill="#7f8c8d" />
    <rect x="0" y="20" width="220" height="10" fill="#7f8c8d" />
    <text x="110" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">
      Robot URDF Model
    </text>
    <text x="15" y="55" font-family="system-ui, sans-serif" font-size="11" fill="#2c3e50">• Link lengths &amp; visual hulls</text>
    <text x="15" y="75" font-family="system-ui, sans-serif" font-size="11" fill="#2c3e50">• Joint origins &amp; axes</text>
    <text x="15" y="95" font-family="monospace" font-size="10" fill="#7f8c8d">eduarm_6dof.urdf</text>
  </g>

  <!-- Input 2: Joint States Topic -->
  <g transform="translate(60, 280)">
    <rect x="0" y="0" width="220" height="110" rx="8" fill="#ebf5fb" stroke="#2980b9" stroke-width="2" filter="url(#box-shadow)" />
    <rect x="0" y="0" width="220" height="30" rx="8" fill="#2980b9" />
    <rect x="0" y="20" width="220" height="10" fill="#2980b9" />
    <text x="110" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">
      /joint_states Topic
    </text>
    <text x="15" y="55" font-family="system-ui, sans-serif" font-size="11" fill="#1b4f72">• Message: sensor_msgs/JointState</text>
    <text x="15" y="75" font-family="system-ui, sans-serif" font-size="11" fill="#1b4f72">• Joint positions: [q1, q2, ..., q6]</text>
    <text x="15" y="95" font-family="system-ui, sans-serif" font-size="10" fill="#7f8c8d">Publisher: joint_state_publisher_gui</text>
  </g>

  <!-- Flow Arrows into Robot State Publisher -->
  <path d="M 280 165 L 370 210" fill="none" stroke="#2c3e50" stroke-width="3" marker-end="url(#arr-flow)" />
  <path d="M 280 335 L 370 290" fill="none" stroke="#2c3e50" stroke-width="3" marker-end="url(#arr-flow)" />

  <!-- Center: robot_state_publisher Node -->
  <g transform="translate(380, 180)">
    <rect x="0" y="0" width="220" height="140" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="2.5" filter="url(#box-shadow)" />
    <rect x="0" y="0" width="220" height="35" rx="10" fill="#27ae60" />
    <rect x="0" y="25" width="220" height="10" fill="#27ae60" />
    <text x="110" y="23" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">
      robot_state_publisher
    </text>
    <text x="15" y="60" font-family="system-ui, sans-serif" font-size="11" fill="#145a32">• Ingests robot_description</text>
    <text x="15" y="80" font-family="system-ui, sans-serif" font-size="11" fill="#145a32">• Subscribes to /joint_states</text>
    <text x="15" y="100" font-family="system-ui, sans-serif" font-size="11" fill="#145a32">• Computes FK using KDL tree</text>
    <text x="15" y="122" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#1e8449">Broadcasts /tf and /tf_static</text>
  </g>

  <!-- Flow Arrows to Consumers -->
  <path d="M 600 230 L 680 160" fill="none" stroke="#e67e22" stroke-width="3" marker-end="url(#arr-tf)" />
  <text x="630" y="180" font-family="monospace" font-size="11" font-weight="bold" fill="#d35400">/tf</text>

  <path d="M 600 270 L 680 340" fill="none" stroke="#e67e22" stroke-width="3" marker-end="url(#arr-tf)" />
  <text x="625" y="325" font-family="monospace" font-size="11" font-weight="bold" fill="#d35400">/tf_static</text>

  <!-- Right: Consumers -->
  <!-- Consumer 1: RViz2 -->
  <g transform="translate(690, 110)">
    <rect x="0" y="0" width="210" height="110" rx="8" fill="#fdfefe" stroke="#8e44ad" stroke-width="2" filter="url(#box-shadow)" />
    <rect x="0" y="0" width="210" height="30" rx="8" fill="#8e44ad" />
    <rect x="0" y="20" width="210" height="10" fill="#8e44ad" />
    <text x="105" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">
      RViz2 3D Visualizer
    </text>
    <text x="15" y="55" font-family="system-ui, sans-serif" font-size="11" fill="#4a235a">• RobotModel plugin</text>
    <text x="15" y="75" font-family="system-ui, sans-serif" font-size="11" fill="#4a235a">• TF RGB axis display</text>
    <text x="15" y="95" font-family="system-ui, sans-serif" font-size="11" fill="#4a235a">• Fixed frame: base_link</text>
  </g>

  <!-- Consumer 2: Navigation & Motion Planning -->
  <g transform="translate(690, 280)">
    <rect x="0" y="0" width="210" height="110" rx="8" fill="#fdfefe" stroke="#c0392b" stroke-width="2" filter="url(#box-shadow)" />
    <rect x="0" y="0" width="210" height="30" rx="8" fill="#c0392b" />
    <rect x="0" y="20" width="210" height="10" fill="#c0392b" />
    <text x="105" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">
      Downstream Nodes
    </text>
    <text x="15" y="55" font-family="system-ui, sans-serif" font-size="11" fill="#78281f">• Nav2 (Costmaps &amp; Footprint)</text>
    <text x="15" y="75" font-family="system-ui, sans-serif" font-size="11" fill="#78281f">• MoveIt 2 (Collision Checker)</text>
    <text x="15" y="95" font-family="system-ui, sans-serif" font-size="11" fill="#78281f">• Perception (Point Cloud Fusion)</text>
  </g>

  <!-- Footer Tip -->
  <rect x="60" y="445" width="840" height="42" rx="6" fill="#f8f9fa" stroke="#e2e8f0" />
  <text x="480" y="470" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#4a5568">
    <tspan font-weight="bold" fill="#27ae60">Summary:</tspan> The robot state publisher guarantees every node on the ROS 2 graph can query transforms at any historical timestamp via TF2 buffer lookups.
  </text>
</svg>
